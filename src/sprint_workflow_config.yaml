sprint_cadence:
  cycle_length: "2_weeks"
  ceremonies:
    sprint_planning:
      duration: "2_hours"
      input: "Ranked Product Backlog (INVEST Stories)"
      output: "Committed Sprint Backlog + Sprint Goal"
    daily_scrum:
      duration: "15_minutes"
      focus:
        - "Yesterday's contribution to Sprint Goal"
        - "Today's planned delivery commitment"
        - "Blockers and routing engine dependencies"
    sprint_review:
      duration: "1_hour"
      demo_target: "Live Fleet Dynamic Routing Engine"
    sprint_retrospective:
      duration: "45_minutes"
      continuous_improvement_action_items: 2

delivery_governance_rules:
  wip_limit_per_engineer: 2
  impediment_escalation_sla_hours: 4
  definition_of_done:
    - "Unit test coverage >= 85%"
    - "Fleet simulation latency <= 250ms"
    - "Product Owner sign-off on staging dispatch portal"
    
